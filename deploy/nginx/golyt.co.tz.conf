# /etc/nginx/sites-available/golyt.co.tz
#
# Live files: /var/www/golyt.co.tz/current
# API:        http://127.0.0.1:8070  (glyt-backend — same as ops.golyt.co.tz)
#
# Install (same VPS as ops.golyt.co.tz):
#   sudo cp deploy/nginx/golyt.co.tz.conf /etc/nginx/sites-available/golyt.co.tz
#   sudo ln -sfn /etc/nginx/sites-available/golyt.co.tz /etc/nginx/sites-enabled/golyt.co.tz
#   sudo nginx -t && sudo systemctl reload nginx
#
# After nginx -t passes, issue the certificate. Certbot adds HTTPS itself:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d golyt.co.tz -d www.golyt.co.tz

server {
    listen 80;
    listen [::]:80;
    server_name golyt.co.tz www.golyt.co.tz;

    root /var/www/golyt.co.tz/current;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    location /api/ {
        # Same-origin SPA → API. Drop Origin so Spring CorsFilter does not reject.
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_read_timeout 60s;
    }

    location /track/ {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
